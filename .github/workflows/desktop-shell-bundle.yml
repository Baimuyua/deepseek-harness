name: Desktop shell bundle

on:
  push:
    branches: [desktop-shell]
    paths:
      - 'apps/desktop-shell/**'
      - 'packages/**'
      - 'apps/cli/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-shell-bundle.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build (branch/tag/sha)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  bundle:
    name: desktop shell / ${{ matrix.name }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            runtime-platform: darwin-arm64
            artifacts: apps/desktop-shell/src-tauri/target/release/bundle
          # fs-ext compiles from source via node-gyp on install; windows-latest
          # ships VS 18, which node-gyp cannot drive, so pin windows-2022
          # (VS 2022) for the C++ toolchain.
          - os: windows-2022
            name: windows-x64
            runtime-platform: win-x64
            artifacts: apps/desktop-shell/src-tauri/target/release/bundle
          - os: ubuntu-latest
            name: linux-x64
            runtime-platform: linux-x64
            artifacts: apps/desktop-shell/src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: install linux webkit deps
        if: runner.os == 'Linux'
        # libfuse2: linuxdeploy (the AppImage tool tauri runs) is itself an
        # AppImage and needs FUSE, which ubuntu-latest no longer preinstalls.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      # The app embeds the published @deepseek-ai/dsh npm tree plus an
      # official Node distribution, so the bundle needs no repo build.
      - name: embed dsh runtime
        working-directory: apps/desktop-shell
        run: node scripts/embed-runtime.mjs --platform ${{ matrix.runtime-platform }}
        shell: bash

      - name: bundle desktop shell
        working-directory: apps/desktop-shell/src-tauri
        run: npx -y @tauri-apps/cli@^2 build
        shell: bash

      - name: bundle smoke (macOS only)
        if: runner.os == 'macOS'
        run: codesign -dvv "apps/desktop-shell/src-tauri/target/release/bundle/macos/DeepSeek Harness.app"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: publish desktop-latest release
    needs: bundle
    if: success() && github.ref == 'refs/heads/desktop-shell'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: dist
          merge-multiple: true

      - name: publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: dsh desktop (rolling)
          prerelease: true
          files: |
            dist/dmg/*.dmg
            dist/msi/*.msi
            dist/nsis/*.exe
            dist/appimage/*.AppImage
            dist/deb/*.deb
            dist/rpm/*.rpm
